#
# All accepted values are listed in: hidlimw/src/common/config.cpp
# 
# Accepted parameters are:
# client_loggers=AV,DMX
# server_loggers=AV,DMX
#        to activate a set of loggers either for client side or server side.
# client_log_level=DEBUG
# server_log_level=DEBUG
#        to set the log level of the loggers listed in 'loggers'.
#        By default all loggers are in WARNING.
# client_watchdog_enable=YES
# server_watchdog_enable=NO
#        to activate the watchdog either for client side or server side.
# client_watchdog_timeout=6000
# server_watchdog_timeout=6000
#        to set the watchdog timeout either for client side or server side.
# 


client_loggers = AV
client_log_level = INFO
client_watchdog_enable = NO
client_watchdog_timeout = 6543

server_loggers = SERVICE,AV
server_log_level = INFO
server_watchdog_enable = NO
server_watchdog_timeout = 6789
